<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Play - Ruleta Europea</title>
  <link rel="stylesheet" href="ruleta.css">
</head>
<body>

<header>
  <a href="/index/index.html" class="volver">← VOLVER</a>
  <div>
    <h1>ROYAL PLAY</h1>
    <h2>RULETA CLÁSICA</h2>
  </div>
</header>

<main>
  <section class="zona-ruleta">
    <div class="ruleta-container">
      <div class="flecha"></div>
      <div id="ruleta" class="ruleta">
        <div class="aros"></div>
        <div id="numerosRuleta"></div>
        <div class="centro"><span>★</span></div>
        <div id="bola" class="bola"></div>
      </div>
    </div>
    <h2 id="resultado">¡Haz tu predicción!</h2>
    <button id="girar">GIRAR RULETA</button>
  </section>

  <section class="zona-tablero">
    <div class="tablero">
      <!-- Docenas arriba como en la foto -->
      <div class="docenas-top">
        <button data-tipo="docena" data-valor="1">1-12</button>
        <button data-tipo="docena" data-valor="2">13-24</button>
        <button data-tipo="docena" data-valor="3">25-36</button>
      </div>

      <div class="mesa-contenedor">
        <div class="cero-box">
          <button class="casilla verde" data-tipo="numero" data-valor="0">0</button>
        </div>

        <div class="grid-numeros">
          <button class="casilla rojo" data-tipo="numero" data-valor="3">3</button>
          <button class="casilla negro" data-tipo="numero" data-valor="6">6</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="9">9</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="12">12</button>
          <button class="casilla negro" data-tipo="numero" data-valor="15">15</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="18">18</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="21">21</button>
          <button class="casilla negro" data-tipo="numero" data-valor="24">24</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="27">27</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="30">30</button>
          <button class="casilla negro" data-tipo="numero" data-valor="33">33</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="36">36</button>

          <button class="casilla negro" data-tipo="numero" data-valor="2">2</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="5">5</button>
          <button class="casilla negro" data-tipo="numero" data-valor="8">8</button>
          <button class="casilla negro" data-tipo="numero" data-valor="11">11</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="14">14</button>
          <button class="casilla negro" data-tipo="numero" data-valor="17">17</button>
          <button class="casilla negro" data-tipo="numero" data-valor="20">20</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="23">23</button>
          <button class="casilla negro" data-tipo="numero" data-valor="26">26</button>
          <button class="casilla negro" data-tipo="numero" data-valor="29">29</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="32">32</button>
          <button class="casilla negro" data-tipo="numero" data-valor="35">35</button>

          <button class="casilla rojo" data-tipo="numero" data-valor="1">1</button>
          <button class="casilla negro" data-tipo="numero" data-valor="4">4</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="7">7</button>
          <button class="casilla negro" data-tipo="numero" data-valor="10">10</button>
          <button class="casilla negro" data-tipo="numero" data-valor="13">13</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="16">16</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="19">19</button>
          <button class="casilla negro" data-tipo="numero" data-valor="22">22</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="25">25</button>
          <button class="casilla negro" data-tipo="numero" data-valor="28">28</button>
          <button class="casilla negro" data-tipo="numero" data-valor="31">31</button>
          <button class="casilla rojo" data-tipo="numero" data-valor="34">34</button>
        </div>

        <div class="columnas-2to1">
          <button data-tipo="columna" data-valor="3">2to1</button>
          <button data-tipo="columna" data-valor="2">2to1</button>
          <button data-tipo="columna" data-valor="1">2to1</button>
        </div>
      </div>

      <!-- Apuestas externas inferiores -->
      <div class="externas">
        <button data-tipo="rango" data-valor="1-18">1-18</button>
        <button data-tipo="paridad" data-valor="par">Even</button>
        <button data-tipo="color" data-valor="rojo"><div class="rombo rojo"></div></button>
        <button data-tipo="color" data-valor="negro"><div class="rombo negro"></div></button>
        <button data-tipo="paridad" data-valor="impar">Odd</button>
        <button data-tipo="rango" data-valor="19-36">19-36</button>
      </div>
    </div>

    <div class="informacion">
      <span>PREDICCIÓN: <b id="prediccion">Ninguna</b></span>
      <span>PARTIDAS: <b id="partidas">0</b></span>
      <span>ACIERTOS: <b id="aciertos">0</b></span>
    </div>
  </section>
</main>

<script src="ruleta.js"></script>
</body>
</html>
