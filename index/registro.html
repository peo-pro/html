<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Royal Play</title>

    <link rel="stylesheet" href="/index/registro.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>

<body>

<header>

    <div class="logo">
        <img src="/logo.png" alt="Royal Play">
        <h1>ROYAL PLAY</h1>
    </div>

</header>

<section class="registro">

    <div class="registro-box">

        <h2>Registro de Jugador</h2>

            <form onsubmit="window.location.href='/index/index.html'; return false;">

                <label>Nombre</label>
                <input type="text"
                    name="nombre"
                    required>

                <label>Apellido</label>
                <input type="text"
                    name="apellido"
                    required>

                <label>Correo Electrónico</label>
                <input type="email"
                    name="email"
                    placeholder="ejemplo@icttalagante.cl"
                    pattern="^[a-zA-Z0-9._%+-]+@icttalagante\.cl$"
                    title="El correo debe terminar estrictamente en @icttalagante.cl"
                    required>

                <button type="submit">
                    Registrarse
                </button>

            </form>

        <br>

        <a href="/index/index.html" class="volver">Volver al Inicio</a>

    </div>

</section>

</body>
</html>
